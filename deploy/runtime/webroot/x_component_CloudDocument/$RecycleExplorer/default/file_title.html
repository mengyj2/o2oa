<div class="head-row" data-o2-element="headRowNode">
    <span class="head-cell checkbox">
        <label class="ant-checkbox-wrapper">
            <span class="ant-checkbox" data-o2-element="allSelectedNode" data-o2-events="click:selectAll">
            <span class="ant-checkbox-inner"></span>
            </span>
        </label>
    </span>
    <span class="head-cell file-op" style="display: none">
        选择了 <span data-o2-element="selectCountNode"></span> 个文件/文件夹
        <span data-o2-element="toolbarNode"></span>
    </span>
    <span class="head-cell file-name">文件名</span>
    <span class="head-cell file-size">文件大小</span>
    <span class="head-cell update-time">删除时间</span>
    <span class="head-cell file-more"></span>
</div>
