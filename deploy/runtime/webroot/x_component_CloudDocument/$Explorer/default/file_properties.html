<div class="ant-descriptions file_properties">
    <div class="ant-descriptions-view">
        <table>
            <tbody>
            <tr class="ant-descriptions-row">
                <td colspan="2" class="ant-descriptions-item">
                    <span class="ant-descriptions-item-label ant-descriptions-item-colon">
                        <span class="text_title">文件名</span>
                    </span>
                </td>
            </tr>
            <tr class="ant-descriptions-row">
                <td colspan="2" class="ant-descriptions-item">
                    <div>
                        <span class="ant-descriptions-item-content">
                            <span>{{$.fileName}}</span>
                        </span>
                    </div>
                </td>
            </tr>
            <tr class="ant-descriptions-row">
                <td colspan="1" class="ant-descriptions-item">
                    <span class="ant-descriptions-item-label ant-descriptions-item-colon">
                        <span class="text_title">大小</span>
                    </span>
                </td>
                <td colspan="1" class="ant-descriptions-item">
                    <span class="ant-descriptions-item-label ant-descriptions-item-colon">
                        <span class="text_title">文件 ID</span>
                    </span>
                </td>
            </tr>
            <tr class="ant-descriptions-row">
                <td colspan="1" class="ant-descriptions-item">
                    <div>
                        <span class="ant-descriptions-item-content">
                            <span>{{$.fileSize}}</span>
                        </span>
                    </div>
                </td>
                <td colspan="1" class="ant-descriptions-item">
                    <div>
                        <span class="ant-descriptions-item-content">
                            <span>{{$.id}}</span>
                        </span>
                    </div>
                </td>
            </tr>
            <tr class="ant-descriptions-row">
                <td colspan="1" class="ant-descriptions-item">
                    <span class="ant-descriptions-item-label ant-descriptions-item-colon">
                        <span class="text_title">上传者</span>
                    </span>
                </td>
                <td colspan="1" class="ant-descriptions-item">
                    <span class="ant-descriptions-item-label ant-descriptions-item-colon">
                        <span class="text_title">创建时间</span>
                    </span>
                </td>
            </tr>
            <tr class="ant-descriptions-row">
                <td colspan="1" class="ant-descriptions-item">
                    <div>
                        <span class="ant-descriptions-item-content">
                            <span class="team-name">{{$.person}}</span>
                        </span>
                    </div>
                </td>
                <td colspan="1" class="ant-descriptions-item">
                    <div>
                        <span class="ant-descriptions-item-content">
                            <span>{{$.createTime}}</span>
                        </span>
                    </div>
                </td>
            </tr>
            <tr class="ant-descriptions-row">
                <td colspan="1" class="ant-descriptions-item">
                    <span class="ant-descriptions-item-label ant-descriptions-item-colon">
                        <span class="text_title">最后修改者</span>
                    </span>
                </td>
                <td colspan="1" class="ant-descriptions-item">
                    <span class="ant-descriptions-item-label ant-descriptions-item-colon">
                        <span class="text_title">修改时间</span>
                    </span>
                </td>
            </tr>
            <tr class="ant-descriptions-row">
                <td colspan="1" class="ant-descriptions-item">
                    <div>
                        <span class="ant-descriptions-item-content">
                            <span class="team-name">{{$.updater}}</span>
                        </span>
                    </div>
                </td>
                <td colspan="1" class="ant-descriptions-item">
                    <div>
                        <span class="ant-descriptions-item-content">
                            <span>{{$.updateTime}}</span>
                        </span>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
