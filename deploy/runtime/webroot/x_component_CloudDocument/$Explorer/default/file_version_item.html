<tr class="ant-table-row ant-table-row-level-0 version_row" >
    <td class="">
        <div class="version_item">
            <span class="item-text-desc">第{{$.version}}版{{$.comment_show}}</span>
        </div>
    </td>
    <td class="ant-table-column-has-actions ant-table-column-has-filters ant-table-row-cell-break-word">
        <div class="version_item">
            <span class="item-text">{{$.personName}}</span>
        </div>
    </td>
    <td class="ant-table-row-cell-break-word">
        <div class="version_item">
            <span class="item-text text-col">{{$.updateTime}}</span>
            <span class="actions operation-col">
                <i class="iconfont icon_download"></i>
                <div class="ant-divider ant-divider-vertical"></div>
                <i class="iconfont icon_recycler"></i>
                <div class="ant-divider ant-divider-vertical"></div>
                <i class="iconfont icon_edit"></i>
<!--                <div class="ant-divider ant-divider-vertical"></div>-->
<!--                <i class="iconfont icon_recover"></i>-->

        </div>
