<form class="ant-form ant-form-horizontal team_set">
    <div class="ant-row ant-form-item">
        <div class="ant-col ant-col-4 ant-form-item-label">
            <label class="ant-form-item-required" >企业名称</label>
        </div>
        <div class="ant-col ant-col-20 ant-form-item-control-wrapper">
            <div class="ant-form-item-control">
                <span class="ant-form-item-children">
					<input placeholder="" type="text" class="ant-input" value="" data-o2-element="orgName"/>
				</span>
            </div>
        </div>
    </div>
    <div class="ant-row ant-form-item">
        <div class="ant-col ant-col-4 ant-form-item-label">
            <label>企业介绍</label>
        </div>
        <div class="ant-col ant-col-20 ant-form-item-control-wrapper">
            <div class="ant-form-item-control">
                <span class="ant-form-item-children">
					<textarea placeholder="" class="ant-input" data-o2-element="orgDesc" style="height: 52px; min-height: 52px; max-height: 136px;"></textarea>
				</span>
            </div>
        </div>
    </div>
</form>
