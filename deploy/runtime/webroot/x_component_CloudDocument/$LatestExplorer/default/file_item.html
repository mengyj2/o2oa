<div class="root_rows">
    <div class="item-row ant-dropdown-trigger">
        <div class="item-cell nocheckbox">
        </div>
        <div class="item-cell file-icon">
            <img src="../x_component_CloudDocument/$Main/default/img/fileType/{{$.fileType}}.png" style="width: 24px; height: 24px;" />
        </div>
        <div class="item-cell file-name">
            <div class="wrapper wrapper-tags-file-name">
                <span class="file-name-content">
                  <div class="name">{{$.name}}</div>
                    <i class="none iconfont icon_fav2 favorite-star {{$.display}}"></i>
                </span>
            </div>
            <div class="file-tags">
                <div class="tags-inline">
                </div>
            </div>
        </div>
        <div class="item-cell file-size">{{$.personName}}</div>
        <div class="item-cell update-time">{{$.time}}</div>
        <div class="item-cell file-more">
            <div class="file-actions">
                <button type="button" class="ant-btn components-btn-nobg">
                    <i class="iconfont icon_more2"></i>
                </button>
            </div>
        </div>
    </div>
</div>
