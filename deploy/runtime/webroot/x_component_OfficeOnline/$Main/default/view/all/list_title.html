<div class="contentTitleArea">
    <table>
        <colgroup>
            <col width="50px">
            <col width="50%">
            <col width="25%">
            <col width="25%">
        </colgroup>
        <thead>
        <tr class="listItem">
            <th>
                <div class="selectFlag">
                    <div class="selectFlagArea" style="cursor: pointer"
                         data-o2-events="click:selectAllFile">
                        <div class="selectFlagIcon"></div>
                    </div>
                </div>
            </th>
            <th data-o2-element="sortNameNode" data-o2-events="click:sortFile:name">
                <span>文件名</span>
                <div class="sort" style="display: none">
                    <i class="o2Drive icon-shangjiantou"></i>
                    <i class="o2Drive icon-xiajiantou mainColor_color"></i>
                </div>
            </th>
            <th data-o2-element="sortUpdateTimeNode"  data-o2-events="click:sortFile:updateTime"><span>修改时间</span>
                <div class="sort" style="display: none">
                    <i class="o2Drive icon-shangjiantou"></i>
                    <i class="o2Drive icon-xiajiantou mainColor_color"></i>
                </div>
            </th>
            <th data-o2-element="sortLenthNode"  data-o2-events="click:sortFile:length">
                <span>大小</span>
                <div class="sort"  style="display: none">
                    <i class="o2Drive icon-shangjiantou"></i>
                    <i class="o2Drive icon-xiajiantou mainColor_color"></i>
                </div></th>
        </tr>
        </thead>
    </table>
</div>
