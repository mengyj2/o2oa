<div>
    {{if $.data.length}}
    <table>
        <colgroup>
            <col width="50px">
            <col width="50%">
            <col width="25%">
            <col width="25%">
        </colgroup>
        <tbody>
        {{each $.data}}
        <tr class="listItem" data-o2-events="mouseover:overTaskItem; mouseout:outTaskItem; o2load:loadItemFlag">
            <td>
                <div class="selectFlag" style="display: none">
                    <div class="selectFlagArea" style="cursor: pointer"data-o2-events="click:selectFile:{{$.id}}">
                        <div class="selectFlagIcon"></div>
                    </div>
                </div>
            </td>
            <td style="text-align: left;">
                <div class="listItemTitle" style="display: flex"  >
                    <div class="listItemTitleIcon">
                        <img src="../x_component_OfficeOnline/$Main/default/filetype/{{$.fileType}}.png" class="{{$.id}}">
                    </div>

                    <div style="vertical-align: middle;width: 100%">
                        <div class="listItemTitleSubject" data-o2-events="click:open:{{$.id}}">
                            {{$.name}}
                        </div>
<!--                        <div class="file-tags">-->
<!--                            <div class="tags-inline">-->

<!--                                {{each $.tagList}}-->
<!--                                <span class="tag-item">-->
<!--                                    {{$}}-->
<!--                                </span>-->
<!--                                {{end each}}-->

<!--                            </div>-->
<!--                        </div>-->
                    </div>

                </div>

            </td>
            <td style="text-align: left;"><span>{{$.updateTime}}</span></td>
            <td style="text-align: left;"><span>{{$.length}}</span></td>
        </tr>
        {{end each}}
        </tbody>
    </table>
    {{end if}}
    {{if !$.data.length}}
    <div class="emptyListArea">
        <div class="emptyListIcon"></div>
        <div class="emptyListText">
            {{$.lp.noFile}}
        </div>
    </div>
    {{end if}}
</div>
